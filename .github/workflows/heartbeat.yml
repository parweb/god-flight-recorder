name: org-heartbeat
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow ping (store sitemap urls)
        run: |
          for u in / /leaderboard /tools /compare /free; do
            curl -s -o /dev/null -w "%{http_code} $u\n" \
              "https://api.indexnow.org/indexnow?url=https://1h-money-store.vercel.app${u}&key=7d3b1f9a4c62e05821af6d94b3c7e08a"
          done
      - name: Liveness probe
        run: curl -s -o /dev/null -w "store %{http_code}\n" https://1h-money-store.vercel.app/
